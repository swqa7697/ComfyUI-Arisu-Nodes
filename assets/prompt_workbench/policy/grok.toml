[ui]
permission_mode = "dontAsk"
disable_bypass_permissions_mode = true
remember_tool_approvals = false

[cli]
auto_update = false

[session]
load_envrc = false

[managed_mcps]
enabled = false
gateway_tools_enabled = false

[subagents]
enabled = false

[memory]
enabled = false

[sandbox]
profile = "read-only"
auto_allow_bash = false

[permission]
allow = ["MCPTool(workbench__get_context)", "MCPTool(workbench__read_image)", "MCPTool(workbench__read_skill)"]
deny = ["Bash", "Edit", "Read", "Grep", "WebFetch", "WebSearch"]

[mcp_servers.workbench]
command = "/usr/local/bin/python"
args = ["/opt/workbench/mcp_server.py"]
