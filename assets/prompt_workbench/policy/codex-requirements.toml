allowed_approval_policies = ["never"]
allowed_sandbox_modes = ["read-only"]
allowed_web_search_modes = ["disabled"]
allow_managed_hooks_only = true

[features]
shell_tool = false
multi_agent = false
apps = false
plugins = false
remote_plugin = false
memories = false
browser_use = false
computer_use = false
hooks = true
view_image = false
tool_suggest = false
browser_use_external = false
code_mode = false

[mcp_servers.workbench.identity]
command = "/usr/local/bin/python"

[hooks]
managed_dir = "/opt/workbench"

[[hooks.PreToolUse]]
matcher = ".*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/local/bin/python /opt/workbench/policy.py"
timeout = 5
