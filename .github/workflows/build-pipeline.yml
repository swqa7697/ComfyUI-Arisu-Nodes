name: CI build

on:
  pull_request:
    branches:
      - master
      - main
jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf8"
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: make install LOCKED=1
      - name: Tidy (assert no diff)
        run: |
          make tidy
          git diff --exit-code
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
