name: CI build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: 'utf8'
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      # Node and pnpm before make install, so ensure_deps.sh finds them and installs nothing.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: Install dependencies
        run: make install LOCKED=1
      - name: Tidy (assert no diff)
        run: |
          make tidy
          git diff --exit-code
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
