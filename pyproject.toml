[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "arisu_nodes"
version = "1.1.2"
description = "A package of useful ComfyUI nodes optimizing user experience."
authors = [{ name = "swqa7697" }]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = []
dependencies = ["pillow"]

[dependency-groups]
dev = ["beautysh>=6.4.3", "mbake>=1.4.6", "pytest>=9.1.1", "ruff>=0.16.7", "uv-sort>=0.8.0"]

[project.urls]
Repository = "https://github.com/swqa7697/ComfyUI-Arisu-Nodes"

[tool.comfy]
PublisherId = "swqa7697"
DisplayName = "ComfyUI-Arisu-Nodes"
Icon = "https://raw.githubusercontent.com/swqa7697/ComfyUI-Arisu-Nodes/main/assets/icon.svg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not comfyui'"
markers = ["comfyui: needs ComfyUI's interpreter and source tree on sys.path"]

[tool.ruff]
target-version = "py310"
line-length = 140
src = [".", "scripts", "src", "tests"]

[tool.ruff.lint]
extend-select = [
    "I",    # isort: sorted top-level imports (see CLAUDE.md, Import conventions)
    "S307", # suspicious-eval-usage: flag any eval() call; not in ruff's default set
]
ignore = [
    "N999",  # the repo dir is the package ComfyUI imports; its name is fixed
    "UP006", # typing convention: List/Dict/... over list/dict builtins
    "UP007", # typing convention: Union[X, Y] over X | Y
    "UP035", # typing convention: import from typing, not collections.abc
    "UP045", # typing convention: Optional[X] over X | None
    "UP046", # typing convention: TypeVar + Generic[T] over PEP 695 (classes)
    "UP047", # typing convention: TypeVar / ParamSpec over PEP 695 (functions)
]
