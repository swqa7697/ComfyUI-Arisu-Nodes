[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "arisu_nodes"
version = "0.1.0"
description = "A package of useful nodes optimizing user experience."
authors = [{name = "swqa7697"}]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = []
dependencies = []

[project.urls]
Repository = "https://github.com/swqa7697/ComfyUI-Arisu-Nodes"

[tool.comfy]
PublisherId = "swqa7697"
DisplayName = "ComfyUI-Arisu-Nodes"
Icon = ""

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not comfyui'"
markers = [
    "comfyui: needs ComfyUI's interpreter and source tree on sys.path",
]

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
line-length = 140
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",  # blank line with whitespace
    "F",  # Pyflakes: syntax errors and undefined names
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
